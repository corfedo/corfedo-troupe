name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults

      # Publishes the Native AOT smoke application, fails on any trimming or AOT warning, and runs it.
      - name: Native AOT smoke test
        shell: bash
        run: |
          dotnet publish tests/Corfedo.Troupe.AotSmoke -c Release -r linux-x64 --no-restore -o artifacts/aot-smoke -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true 2>&1 | tee aot-smoke.log
          if grep -Eq 'warning (IL|CS)[0-9]+' aot-smoke.log; then echo "AOT smoke publish reported warnings" >&2; exit 1; fi
          artifacts/aot-smoke/Corfedo.Troupe.AotSmoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
